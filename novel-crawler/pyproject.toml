[project]
name = "novel-crawler"
version = "0.1.0"
description = "Tải bản raw truyện Trung (17k, Zongheng, 69shu, Biquge, Tieba) thành file .txt từng chương"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.49",
    "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
novel-crawler = "novel_crawler.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novel_crawler"]
