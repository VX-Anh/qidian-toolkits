services:
  vietphase:
    build: .
    image: vietphase:latest
    container_name: vietphase
    restart: unless-stopped

    # Phơi trực tiếp ra ngoài: truy cập http://IP:9166 (không reverse proxy).
    # Định dạng "host:container" — host 9166 → container 9999 (uvicorn).
    # /api/* được bảo vệ bằng API_TOKEN (bắt buộc, xem environment bên dưới).
    # Đứng sau reverse proxy thì đổi thành "127.0.0.1:9166:9999" để không lộ port.
    ports:
      - "9166:9999"

    env_file:
      - .env

    environment:
      # Đường dẫn dữ liệu BÊN TRONG container — trỏ vào các volume mount bên dưới.
      # Override giá trị mặc định (Windows) trong config.py.
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/output
      OCR_IMAGES_DIR: /data/ocr_images
      VIETPHASE_DIR: /data/vietphase
      DB_PATH: /data/db/state.db
      RULES_DIR: rules
      # Bắt buộc: compose dừng với lỗi nếu .env chưa có API_TOKEN.
      API_TOKEN: ${API_TOKEN:?Đặt API_TOKEN trong .env trước khi deploy}
      DEV_MODE: "false"
      # OCR offline PaddleOCR chạy ở sidecar service "ocr" bên dưới (share volume /data).
      # Mặc định dùng paddle (miễn phí); vẫn chọn được claude theo từng request.
      OCR_DEFAULT_ENGINE: paddle
      OCR_SERVICE_URL: http://ocr:8000
      # Claude API key (file mount read-only bên dưới) — cho phần dịch + OCR engine claude.
      ANTHROPIC_API_KEY_FILE: /secrets/anthropic_api_key

    volumes:
      # Dữ liệu bền vững: tồn tại qua mỗi lần rebuild/redeploy container.
      - ./data:/data
      # Claude API key, chỉ đọc. Tạo file ./secrets/anthropic_api_key (chỉ chứa key) trên host.
      - ./secrets/anthropic_api_key:/secrets/anthropic_api_key:ro

    depends_on:
      # Chờ sidecar nạp xong model (HEALTHCHECK trong qidian-ocr/Dockerfile) — tránh
      # request OCR đầu tiên sau deploy bị connection refused.
      ocr:
        condition: service_healthy

  # ── Sidecar OCR: PaddleOCR PP-OCRv6 trên GPU ────────────────────────────────
  # Build context là sibling ../qidian-ocr (compose file nằm trong qidian-vietphase/).
  # Cần cả repo qidian-toolkits trên server để thư mục này tồn tại.
  ocr:
    build:
      context: ../qidian-ocr
    image: qidian-ocr:latest
    container_name: qidian-ocr
    restart: unless-stopped

    environment:
      PADDLE_TIER: medium      # PP-OCRv6 medium (chính xác nhất). "small" nhẹ hơn.
      PADDLE_DEVICE: gpu       # "cpu" nếu host không có GPU / chưa cài nvidia toolkit

    volumes:
      # Đọc ảnh + ghi output.txt qua cùng volume /data với vietphase.
      - ./data:/data
      # Cache model PP-OCRv6 → không tải lại mỗi lần rebuild (HOME=/root trong image).
      - paddlex-models:/root/.paddlex

    # Cấp toàn bộ GPU cho container. Yêu cầu nvidia-container-toolkit trên host.
    # Compose v2 yêu cầu gpus là list (không dùng scalar "all"). Không có GPU: bỏ
    # block này + đặt PADDLE_DEVICE=cpu (xem README).
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]

volumes:
  paddlex-models:
